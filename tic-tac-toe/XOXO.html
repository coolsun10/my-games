<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XOXO - Two Player Game</title>
  <style>
    :root {
      --bg-top: #f9f2d8;
      --bg-mid: #d7efe4;
      --bg-bot: #f7c6a3;
      --panel: #fffdf7;
      --line: #1f2a2e;
      --x: #e4572e;
      --o: #2e86ab;
      --muted: #4c5a61;
      --win: #34a853;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 15% 10%, #fff2c5, transparent 40%),
                  radial-gradient(circle at 85% 85%, #ffd8be, transparent 35%),
                  linear-gradient(160deg, var(--bg-top), var(--bg-mid), var(--bg-bot));
      font-family: "Trebuchet MS", "Verdana", sans-serif;
      color: #1d2124;
      padding: 20px;
    }

    .game {
      width: min(94vw, 480px);
      background: var(--panel);
      border: 3px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 30px rgba(31, 42, 46, 0.18);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 3.4vw, 2rem);
      letter-spacing: 0.04em;
    }

    .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 1rem;
      min-height: 1.5em;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 12px;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }

    .cell:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #f6fbff;
    }

    .cell:disabled {
      cursor: not-allowed;
    }

    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win {
      background: #dcf8e5;
      border-color: var(--win);
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.action {
      border: 2px solid var(--line);
      background: #fff;
      color: #111;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      min-width: 120px;
    }

    button.action:hover {
      background: #f4f4f4;
    }

    .score {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      font-size: 0.95rem;
    }

    .score div {
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 8px 4px;
      background: #ffffff;
    }

    .score strong {
      display: block;
      font-size: 1.25rem;
      margin-top: 2px;
    }

    @media (max-width: 420px) {
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="XOXO two player game">
    <h1>XOXO</h1>
    <p id="status" class="status">Player X's turn</p>

    <section class="board" id="board" aria-label="Game board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </section>

    <div class="controls">
      <button class="action" id="newRound">New Round</button>
      <button class="action" id="resetAll">Reset Score</button>
    </div>

    <section class="score" aria-label="Score board">
      <div>X Wins<strong id="xScore">0</strong></div>
      <div>Draws<strong id="drawScore">0</strong></div>
      <div>O Wins<strong id="oScore">0</strong></div>
    </section>
  </main>

  <script>
    const cells = Array.from(document.querySelectorAll('.cell'));
    const statusEl = document.getElementById('status');
    const xScoreEl = document.getElementById('xScore');
    const oScoreEl = document.getElementById('oScore');
    const drawScoreEl = document.getElementById('drawScore');
    const newRoundBtn = document.getElementById('newRound');
    const resetAllBtn = document.getElementById('resetAll');

    const winningCombos = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let currentPlayer = 'X';
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function updateScoreUI() {
      xScoreEl.textContent = String(scores.X);
      oScoreEl.textContent = String(scores.O);
      drawScoreEl.textContent = String(scores.draw);
    }

    function clearBoardOnly() {
      board = Array(9).fill('');
      gameOver = false;
      currentPlayer = 'X';

      cells.forEach((cell) => {
        cell.textContent = '';
        cell.disabled = false;
        cell.classList.remove('x', 'o', 'win');
      });

      setStatus("Player X's turn");
    }

    function checkWinner(player) {
      for (const combo of winningCombos) {
        const [a, b, c] = combo;
        if (board[a] === player && board[b] === player && board[c] === player) {
          return combo;
        }
      }
      return null;
    }

    function disableBoard() {
      cells.forEach((cell) => {
        cell.disabled = true;
      });
    }

    function handleCellClick(event) {
      const cell = event.currentTarget;
      const index = Number(cell.dataset.index);

      if (gameOver || board[index]) {
        return;
      }

      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase());
      cell.disabled = true;

      const winningLine = checkWinner(currentPlayer);
      if (winningLine) {
        winningLine.forEach((i) => {
          cells[i].classList.add('win');
        });
        scores[currentPlayer] += 1;
        updateScoreUI();
        setStatus(`Player ${currentPlayer} wins!`);
        gameOver = true;
        disableBoard();
        return;
      }

      const allFilled = board.every((value) => value !== '');
      if (allFilled) {
        scores.draw += 1;
        updateScoreUI();
        setStatus("It's a draw!");
        gameOver = true;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      setStatus(`Player ${currentPlayer}'s turn`);
    }

    cells.forEach((cell) => {
      cell.addEventListener('click', handleCellClick);
    });

    newRoundBtn.addEventListener('click', clearBoardOnly);

    resetAllBtn.addEventListener('click', () => {
      scores = { X: 0, O: 0, draw: 0 };
      updateScoreUI();
      clearBoardOnly();
    });

    clearBoardOnly();
    updateScoreUI();
  </script>
</body>
</html>
