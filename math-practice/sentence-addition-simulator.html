<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentence Addition Simulator</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #b91c1c;
      --success: #166534;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #eaf2ff, var(--bg));
      color: var(--text);
    }

    .card {
      width: min(100%, 700px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.12);
      padding: 20px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      text-align: center;
    }

    .problem {
      margin: 10px 0 16px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      line-height: 1.5;
      min-height: 88px;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
    }

    #answerInput {
      flex: 1 1 220px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    #submitBtn {
      background: var(--accent);
      color: #fff;
    }

    #submitBtn:hover:enabled { background: var(--accent-hover); }

    #endBtn {
      background: #111827;
      color: #fff;
      width: 100%;
      margin-bottom: 14px;
    }

    button:disabled, input:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .feedback {
      min-height: 24px;
      margin: 8px 0;
      text-align: center;
      font-weight: 600;
    }

    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--danger); }

    .summary {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 0.95rem;
      color: var(--muted);
      white-space: pre-line;
    }

    @media (max-width: 480px) {
      .card { padding: 16px; }
      form { flex-direction: column; }
      #submitBtn { width: 100%; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sentence Addition Simulator</h1>
    <div id="problemText" class="problem" aria-live="polite"></div>

    <form id="answerForm" autocomplete="off">
      <input id="answerInput" type="text" inputmode="numeric" placeholder="Type your answer" aria-label="Answer" />
      <button id="submitBtn" type="submit">Submit</button>
    </form>

    <button id="endBtn" type="button">End Game</button>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <section class="stats" aria-label="Game stats">
      <div class="stat">Attempted: <strong id="attempted">0</strong></div>
      <div class="stat">Correct: <strong id="correct">0</strong></div>
      <div class="stat">Current streak: <strong id="currentStreak">0</strong></div>
      <div class="stat">Best streak: <strong id="bestStreak">0</strong></div>
    </section>

    <div id="summary" class="summary" hidden></div>
  </main>

  <script>
    (function () {
      const answerForm = document.getElementById("answerForm");
      const answerInput = document.getElementById("answerInput");
      const submitBtn = document.getElementById("submitBtn");
      const endBtn = document.getElementById("endBtn");
      const problemTextEl = document.getElementById("problemText");
      const feedbackEl = document.getElementById("feedback");
      const summaryEl = document.getElementById("summary");

      const attemptedEl = document.getElementById("attempted");
      const correctEl = document.getElementById("correct");
      const currentStreakEl = document.getElementById("currentStreak");
      const bestStreakEl = document.getElementById("bestStreak");

      const names = ["Mia", "Noah", "Ava", "Liam", "Emma", "Eli", "Zoe", "Leo", "Ivy", "Owen"];
      const items = ["apples", "pencils", "stickers", "books", "toys", "cookies", "marbles", "crayons"];

      const templates = [
        function (name, item, a, b) {
          return name + " has " + a + " " + item + ". A friend gives " + name.toLowerCase() + " " + b + " more " + item + ". How many " + item + " does " + name + " have now?";
        },
        function (name, item, a, b) {
          return "At school, " + name + " found " + a + " " + item + " and then got " + b + " more " + item + ". How many " + item + " in all?";
        },
        function (name, item, a, b) {
          return name + " put " + a + " " + item + " in a box, then added " + b + " more " + item + ". How many " + item + " are in the box now?";
        }
      ];

      const state = {
        attempted: 0,
        correct: 0,
        currentStreak: 0,
        bestStreak: 0,
        a: 0,
        b: 0,
        isEnded: false,
        isLocked: false,
        timeoutId: null
      };

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function randomChoice(list) {
        return list[randomInt(0, list.length - 1)];
      }

      function setFeedback(message, type) {
        feedbackEl.textContent = message;
        feedbackEl.className = "feedback" + (type ? " " + type : "");
      }

      function updateStats() {
        attemptedEl.textContent = String(state.attempted);
        correctEl.textContent = String(state.correct);
        currentStreakEl.textContent = String(state.currentStreak);
        bestStreakEl.textContent = String(state.bestStreak);
      }

      function nextQuestion() {
        if (state.isEnded) return;

        state.a = randomInt(0, 20);
        state.b = randomInt(0, 20);

        const name = randomChoice(names);
        const item = randomChoice(items);
        const template = randomChoice(templates);

        problemTextEl.textContent = template(name, item, state.a, state.b);
        answerInput.value = "";
        answerInput.focus();
      }

      function setInteractionEnabled(enabled) {
        answerInput.disabled = !enabled;
        submitBtn.disabled = !enabled;
      }

      function endGame() {
        if (state.isEnded) return;
        state.isEnded = true;
        state.isLocked = true;

        if (state.timeoutId) {
          clearTimeout(state.timeoutId);
          state.timeoutId = null;
        }

        setInteractionEnabled(false);
        endBtn.disabled = true;
        setFeedback("Game ended.", "");

        const accuracy = state.attempted === 0 ? 0 : (state.correct / state.attempted) * 100;
        summaryEl.hidden = false;
        summaryEl.textContent =
          "Final Summary\n" +
          "Attempted: " + state.attempted + "\n" +
          "Correct: " + state.correct + "\n" +
          "Accuracy: " + accuracy.toFixed(1) + "%\n" +
          "Best streak: " + state.bestStreak;
      }

      function handleSubmit(event) {
        event.preventDefault();
        if (state.isEnded || state.isLocked) return;

        const raw = answerInput.value.trim();
        if (raw === "") return;
        if (!/^\d+$/.test(raw)) {
          setFeedback("Please enter a whole number.", "error");
          return;
        }

        const userAnswer = parseInt(raw, 10);
        const correctAnswer = state.a + state.b;
        state.attempted += 1;

        if (userAnswer === correctAnswer) {
          state.correct += 1;
          state.currentStreak += 1;
          if (state.currentStreak > state.bestStreak) {
            state.bestStreak = state.currentStreak;
          }
          updateStats();
          setFeedback("Correct!", "success");
          nextQuestion();
          return;
        }

        state.currentStreak = 0;
        updateStats();
        setFeedback("Correct answer: " + correctAnswer, "error");

        state.isLocked = true;
        setInteractionEnabled(false);
        state.timeoutId = setTimeout(function () {
          if (state.isEnded) return;
          state.isLocked = false;
          setInteractionEnabled(true);
          setFeedback("", "");
          nextQuestion();
        }, 3000);
      }

      answerForm.addEventListener("submit", handleSubmit);
      endBtn.addEventListener("click", endGame);

      updateStats();
      nextQuestion();
    })();
  </script>
</body>
</html>
