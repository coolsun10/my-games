<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addition Simulator</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #b91c1c;
      --success: #166534;
      --border: #d1d5db;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #eaf2ff, var(--bg));
      color: var(--text);
    }

    .card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.12);
      padding: 20px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      text-align: center;
    }

    .question {
      margin: 8px 0 18px;
      display: flex;
      justify-content: center;
    }

    .addition-grid {
      --digits: 2;
      display: grid;
      grid-template-columns: 1ch repeat(var(--digits), 1ch);
      column-gap: 0.35ch;
      row-gap: 0.2ch;
      align-items: end;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      font-family: "Courier New", Courier, monospace;
    }

    .op-cell,
    .digit-cell,
    .carry-cell,
    .answer-cell {
      min-width: 1ch;
      text-align: right;
    }

    .op-cell {
      text-align: center;
    }

    .carry-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 1.1em;
    }

    .carry-input {
      width: 1ch;
      min-width: 1ch;
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 0;
      font-size: 0.5em;
      line-height: 1;
      text-align: center;
      color: var(--muted);
      background: #f8fafc;
    }

    .carry-input:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
      color: var(--text);
      background: #fff;
    }

    .line-row {
      grid-column: 1 / -1;
      border-top: 3px solid var(--text);
      height: 0;
      margin: 2px 0;
    }

    .answer-cell {
      letter-spacing: 0.08em;
      grid-column: 2 / -1;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 14px;
    }

    #answerInput {
      flex: 1 1 180px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    #submitBtn {
      background: var(--accent);
      color: #fff;
    }

    #submitBtn:hover:enabled {
      background: var(--accent-hover);
    }

    #endBtn {
      background: #111827;
      color: #fff;
      width: 100%;
      margin-bottom: 14px;
    }

    button:disabled,
    input:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
      font-size: 0.95rem;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .feedback {
      min-height: 24px;
      margin: 8px 0;
      text-align: center;
      font-weight: 600;
    }

    .feedback.success {
      color: var(--success);
    }

    .feedback.error {
      color: var(--danger);
    }

    .summary {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      font-size: 0.95rem;
      color: var(--muted);
      white-space: pre-line;
    }

    @media (max-width: 480px) {
      .card {
        padding: 16px;
      }

      form {
        flex-direction: column;
      }

      #submitBtn {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Addition Simulator</h1>
    <div id="question" class="question" aria-live="polite">
      <div class="addition-grid" style="--digits: 2" aria-label="0 plus 0">
        <div class="op-cell"></div>
        <div class="carry-cell">
          <input class="carry-input" type="text" inputmode="numeric" maxlength="1" aria-label="Tens carryover box" />
        </div>
        <div class="carry-cell">
          <input class="carry-input" type="text" inputmode="numeric" maxlength="1" aria-label="Ones carryover box" />
        </div>

        <div class="op-cell"></div>
        <div class="digit-cell">0</div>
        <div class="digit-cell">0</div>

        <div class="op-cell">+</div>
        <div class="digit-cell">0</div>
        <div class="digit-cell">0</div>

        <div class="line-row"></div>

        <div class="op-cell"></div>
        <div class="answer-cell">?</div>
      </div>
    </div>

    <form id="answerForm" autocomplete="off">
      <input id="answerInput" type="text" inputmode="numeric" placeholder="Type your answer" aria-label="Answer" />
      <button id="submitBtn" type="submit">Submit</button>
    </form>

    <button id="endBtn" type="button">End Game</button>

    <div id="feedback" class="feedback" aria-live="polite"></div>

    <section class="stats" aria-label="Game stats">
      <div class="stat">Attempted: <strong id="attempted">0</strong></div>
      <div class="stat">Correct: <strong id="correct">0</strong></div>
      <div class="stat">Current streak: <strong id="currentStreak">0</strong></div>
      <div class="stat">Best streak: <strong id="bestStreak">0</strong></div>
    </section>

    <div id="summary" class="summary" hidden></div>
  </main>

  <script>
    (function () {
      const answerForm = document.getElementById("answerForm");
      const answerInput = document.getElementById("answerInput");
      const submitBtn = document.getElementById("submitBtn");
      const endBtn = document.getElementById("endBtn");
      const questionEl = document.getElementById("question");
      const feedbackEl = document.getElementById("feedback");
      const summaryEl = document.getElementById("summary");
      let carryInputs = [];

      const attemptedEl = document.getElementById("attempted");
      const correctEl = document.getElementById("correct");
      const currentStreakEl = document.getElementById("currentStreak");
      const bestStreakEl = document.getElementById("bestStreak");

      const state = {
        attempted: 0,
        correct: 0,
        currentStreak: 0,
        bestStreak: 0,
        a: 0,
        b: 0,
        isEnded: false,
        isLocked: false,
        timeoutId: null
      };

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function setFeedback(message, type) {
        feedbackEl.textContent = message;
        feedbackEl.className = "feedback" + (type ? " " + type : "");
      }

      function updateStats() {
        attemptedEl.textContent = String(state.attempted);
        correctEl.textContent = String(state.correct);
        currentStreakEl.textContent = String(state.currentStreak);
        bestStreakEl.textContent = String(state.bestStreak);
      }

      function sanitizeCarryInput(event) {
        event.target.value = event.target.value.replace(/\D/g, "").slice(0, 1);
      }

      function renderAdditionBoard(a, b) {
        const topRaw = String(a);
        const bottomRaw = String(b);
        const digits = Math.max(2, topRaw.length, bottomRaw.length);
        const top = topRaw.padStart(digits, " ");
        const bottom = bottomRaw.padStart(digits, " ");
        const placeNames = ["ones", "tens", "hundreds", "thousands"];

        let html = '<div class="addition-grid" style="--digits: ' + digits + '" aria-label="' + a + " plus " + b + '">';

        html += '<div class="op-cell"></div>';
        for (let i = 0; i < digits; i += 1) {
          const placeIndex = digits - 1 - i;
          const placeName = placeNames[placeIndex] || "place";
          html += '<div class="carry-cell"><input class="carry-input" type="text" inputmode="numeric" maxlength="1" aria-label="' + placeName + ' carryover box" /></div>';
        }

        html += '<div class="op-cell"></div>';
        for (let i = 0; i < digits; i += 1) {
          html += '<div class="digit-cell">' + (top[i] === " " ? "&nbsp;" : top[i]) + "</div>";
        }

        html += '<div class="op-cell">+</div>';
        for (let i = 0; i < digits; i += 1) {
          html += '<div class="digit-cell">' + (bottom[i] === " " ? "&nbsp;" : bottom[i]) + "</div>";
        }

        html += '<div class="line-row"></div>';
        html += '<div class="op-cell"></div><div class="answer-cell">?</div>';
        html += "</div>";

        questionEl.innerHTML = html;
        carryInputs = Array.from(questionEl.querySelectorAll(".carry-input"));
        carryInputs.forEach(function (input) {
          input.addEventListener("input", sanitizeCarryInput);
        });
      }

      function nextQuestion() {
        if (state.isEnded) return;
        state.a = randomInt(0, 20);
        state.b = randomInt(0, 20);
        renderAdditionBoard(state.a, state.b);
        answerInput.value = "";
        answerInput.focus();
      }

      function setInteractionEnabled(enabled) {
        carryInputs.forEach(function (input) {
          input.disabled = !enabled;
        });
        answerInput.disabled = !enabled;
        submitBtn.disabled = !enabled;
      }

      function endGame() {
        if (state.isEnded) return;
        state.isEnded = true;
        state.isLocked = true;
        if (state.timeoutId) {
          clearTimeout(state.timeoutId);
          state.timeoutId = null;
        }
        setInteractionEnabled(false);
        endBtn.disabled = true;
        setFeedback("Game ended.", "");

        const accuracy = state.attempted === 0 ? 0 : (state.correct / state.attempted) * 100;
        summaryEl.hidden = false;
        summaryEl.textContent =
          "Final Summary\n" +
          "Attempted: " + state.attempted + "\n" +
          "Correct: " + state.correct + "\n" +
          "Accuracy: " + accuracy.toFixed(1) + "%\n" +
          "Best streak: " + state.bestStreak;
      }

      function handleSubmit(event) {
        event.preventDefault();
        if (state.isEnded || state.isLocked) return;

        const raw = answerInput.value.trim();
        if (raw === "") return;
        if (!/^\d+$/.test(raw)) {
          setFeedback("Please enter a whole number.", "error");
          return;
        }

        const userAnswer = parseInt(raw, 10);
        const correctAnswer = state.a + state.b;
        state.attempted += 1;

        if (userAnswer === correctAnswer) {
          state.correct += 1;
          state.currentStreak += 1;
          if (state.currentStreak > state.bestStreak) {
            state.bestStreak = state.currentStreak;
          }
          updateStats();
          setFeedback("Correct!", "success");
          nextQuestion();
          return;
        }

        state.currentStreak = 0;
        updateStats();
        setFeedback("Correct answer: " + correctAnswer, "error");

        state.isLocked = true;
        setInteractionEnabled(false);
        state.timeoutId = setTimeout(function () {
          if (state.isEnded) return;
          state.isLocked = false;
          setInteractionEnabled(true);
          setFeedback("", "");
          nextQuestion();
        }, 3000);
      }

      answerForm.addEventListener("submit", handleSubmit);
      endBtn.addEventListener("click", endGame);

      updateStats();
      nextQuestion();
    })();
  </script>
</body>
</html>
